name: Build Android APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test model matching and workbook import
        run: |
          mkdir -p /tmp/model-tests
          javac -encoding UTF-8 -d /tmp/model-tests app/src/main/java/com/sssxzxz/productkeyboard/CandidateVisibility.java app/src/main/java/com/sssxzxz/productkeyboard/ModelMatcher.java app/src/main/java/com/sssxzxz/productkeyboard/ModelWorkbook.java tests/ModelLogicTest.java
          java -cp /tmp/model-tests com.sssxzxz.productkeyboard.ModelLogicTest
      - run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: product-keyboard-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
